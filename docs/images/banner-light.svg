<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="agent-tutor: learn anything with your coding agent by predicting, running and checking">
<defs>
 <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f6f5f1" opacity=".55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f6f5f1" stroke-width="4"/></pattern>
 <clipPath id="r"><rect x="660" y="0" width="520" height="34" rx="6"/></clipPath>
</defs>
<rect width="1280" height="400" fill="#f6f5f1"/>
<g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
 <text x="80" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="1.5" fill="#5c6170">AN AGENT SKILL · CLAUDE CODE FIRST</text>
 <text x="78" y="196" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#16181d">agent-tutor</text>
 <text x="80" y="246" font-size="25" fill="#5c6170">Learn anything with your coding agent.</text>
 <text x="80" y="280" font-size="25" fill="#5c6170">Predict, run it yourself, then check.</text>
 <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
  <rect x="80" y="314" width="94" height="32" rx="6" fill="none" stroke="#dcd9cf"/><text x="127" y="335" text-anchor="middle" fill="#16181d">predict</text>
  <text x="187" y="335" fill="#5c6170">→</text>
  <rect x="206" y="314" width="64" height="32" rx="6" fill="none" stroke="#dcd9cf"/><text x="238" y="335" text-anchor="middle" fill="#16181d">run</text>
  <text x="283" y="335" fill="#5c6170">→</text>
  <rect x="302" y="314" width="78" height="32" rx="6" fill="#1f6f66"/><text x="341" y="335" text-anchor="middle" fill="#f6f5f1">check</text>
  <text x="394" y="335" fill="#5c6170">↺</text>
 </g>
</g>
<g transform="translate(0,96)">
 <rect x="620" y="-36" width="600" height="276" rx="14" fill="#ffffff" stroke="#dcd9cf"/>
 <text x="660" y="2" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#16181d">You add one tool. What survives the cache?</text>
 <g transform="translate(0,26)">
  <g clip-path="url(#r)"><rect x="660.0" y="0" width="22.0" height="34" fill="#56688f"/><rect x="685.0" y="0" width="343.7" height="34" fill="#a87c1f"/><rect x="1031.6" y="0" width="16.4" height="34" fill="#2a8a7e"/><rect x="1051.0" y="0" width="30.3" height="34" fill="#a9583e"/><rect x="1084.3" y="0" width="42.8" height="34" fill="#6e7f2d"/><rect x="1130.1" y="0" width="42.8" height="34" fill="#a9583e"/><rect x="1175.8" y="0" width="1.2" height="34" fill="#8a8f99"/><rect x="894.3" y="0" width="285.7" height="34" fill="url(#h)"/></g>
  <line x1="894.3" y1="-6" x2="894.3" y2="40" stroke="#a9583e" stroke-width="2.5"/>
 </g>
 <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#5c6170">
  <text x="660" y="88">169 reused</text><text x="800" y="88">206 recomputed</text><text x="985" y="88">real Qwen2.5 tokens</text>
 </g>
 <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">
  <rect x="660" y="112" width="520" height="34" rx="7" fill="none" stroke="#dcd9cf"/><text x="676" y="134" fill="#5c6170"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#16181d">A</tspan>   Everything except the tools block</text>
  <rect x="660" y="154" width="520" height="34" rx="7" fill="none" stroke="#1f6f66" stroke-width="2"/><text x="676" y="176" fill="#16181d"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1f6f66">C</tspan>   Up to the new tool; every message again</text>
  <text x="660" y="220" font-size="14" fill="#5c6170">Confidence</text>
  <g font-size="13">
   <rect x="745" y="204" width="100" height="24" rx="5" fill="none" stroke="#dcd9cf"/><text x="795" y="221" text-anchor="middle" fill="#5c6170">Guessing</text>
   <rect x="849" y="204" width="100" height="24" rx="5" fill="none" stroke="#dcd9cf"/><text x="899" y="221" text-anchor="middle" fill="#5c6170">Unsure</text>
   <rect x="953" y="204" width="110" height="24" rx="5" fill="#16181d"/><text x="1008" y="221" text-anchor="middle" fill="#f6f5f1">Fairly sure</text>
   <rect x="1067" y="204" width="113" height="24" rx="5" fill="none" stroke="#dcd9cf"/><text x="1123" y="221" text-anchor="middle" fill="#5c6170">Certain</text>
  </g>
 </g>
</g>
</svg>
